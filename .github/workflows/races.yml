name: Check 4sport for new races
on:
  schedule:
    - cron: '17 5 * * *'   # every day 08:17 Israel time
  workflow_dispatch:
  push:
    paths: ['tools/check_races.py', '.github/workflows/races.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/check_races.py
      - name: Save results
        run: |
          git config user.name "races-bot"
          git config user.email "races-bot@users.noreply.github.com"
          git add -A races.json debug || true
          git diff --cached --quiet || (git commit -m "Update races.json from 4sport" && git push)
